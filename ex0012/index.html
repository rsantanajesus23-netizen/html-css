<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos ospedadoslocalmente!</h1>
    <p>Este vídeo está no meu próprio servidor.</p> 
    <audio src="midia/eden .mp3"controls loop></audio>
    <video width="650" poster="imagens/IMG_20260407_070523_MP.jpg" controls autoplay>
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/meu-video.ogv" type="video/ogg">
    </video>
    <h1>Inserindo vedeos do YouTube!</h1>
    <iframe width="660" height="315" src="https://www.youtube.com/embed/LW0bhKitRBk?si=Vt6oA2PzAycyGR3_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
