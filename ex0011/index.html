<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nídias em HTML</title>
</head>
<body>
    <h1>Imagem dinámica</h1>
    <p>Tente abrir esse site em váriosdispositivos diferentes ou sinplenermte aumente ou diminua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/img-p.png" type="image/png">
        <source media="(max-width:1550px )" srcset="imagens/img-m.png" type="image/png">
        <img src="imagens/img-g.png" alt="Imagem flexível">
    </picture>
    <h1>REproduzindo Àudio</h1>
    <p>Vamos apreder a reproduzir áudio em HTML5.</p>
    <!--<audio src="midia/eden .mp3"controls autoplay></audio>-->
    <audio controls >
        <source src="midia/open-highway .mp3"type="audio/mpeg">
        <source src="midia/open-highway .ogg"type="audio/ogg">
        <source src="midia/open-highway .wav"type="audio/wav">
    </audio>
    <p>Infelimente o seu navegador não reproduzir esse áudio. <a href="midia/open-highway .mp3">-Clique aqui para baixar o arquivo</a></p>
    <video src="midia/meu-video1.mp4" controls autoplay></video>

</body>
</html>
